<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Выбираем расцветки поло</title>
<style>
:root{
  --bg:#fbfbfd; --ink:#1d1d1f; --gray:#6e6e73; --line:#d2d2d7;
  --accent:#0071e3; --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
header{padding:40px 0 6px;text-align:center}
header .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gray);font-weight:600}
header h1{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
header p{font-size:14px;color:var(--gray);max-width:480px;margin:0 auto;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:22px 0 120px}
.card{position:relative;cursor:pointer;border-radius:14px;outline:none;
  transition:transform .18s ease,box-shadow .18s ease;-webkit-tap-highlight-color:transparent}
.card img{display:block;width:100%;height:auto;border-radius:14px;background:#e8e8ed}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.12)}
.card .num{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;color:#fff;
  background:rgba(29,29,31,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:3px 7px;border-radius:999px;letter-spacing:.04em}
.card .check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:grid;place-items:center;
  opacity:0;transform:scale(.5);transition:opacity .16s ease,transform .16s ease}
.card .check svg{width:12px;height:12px;stroke:#1d1d1f;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.card.sel{box-shadow:0 0 0 2.5px var(--ink),0 10px 26px rgba(0,0,0,.16)}
.card.sel .check{opacity:1;transform:scale(1)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(251,251,253,.82);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border-top:1px solid rgba(0,0,0,.08)}
.bar-in{max-width:1180px;margin:0 auto;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:16px}
.bar .count{font-size:15px;color:var(--gray);white-space:nowrap}
.bar .count b{color:var(--ink);font-weight:600}
.btn{margin-left:auto;appearance:none;border:0;cursor:pointer;font:inherit;font-size:16px;font-weight:600;
  color:#fff;background:var(--ink);padding:14px 34px;border-radius:999px;min-width:200px;
  transition:opacity .15s ease,transform .1s ease}
.btn:not(:disabled):active{transform:scale(.97)}
.btn:disabled{opacity:.32;cursor:default}
.btn.busy{opacity:.6}
.bar .err{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);font-size:13px;color:#b3401e;
  background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:6px 12px;box-shadow:0 4px 14px rgba(0,0,0,.08);
  display:none;white-space:nowrap}
.bar .err.on{display:block}
/* экран благодарности */
.done{display:none;min-height:70vh;place-items:center;text-align:center;padding:60px 18px}
.done .big{width:76px;height:76px;border-radius:50%;background:var(--ink);display:grid;place-items:center;margin:0 auto 22px}
.done .big svg{width:34px;height:34px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.done p{color:var(--gray);font-size:16px}
body.voted .grid,body.voted .bar{display:none}
body.voted .done{display:grid}
@media (max-width:640px){
  header{padding-top:28px}
  .grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .btn{min-width:0;flex:1}
  .bar .count{font-size:14px}
}
</style>
</head>
<body>
<header class="wrap">
  <div class="kicker">Новая коллекция</div>
  <h1>Выбираем расцветки поло</h1>
  <p>Нажми на понравившиеся модели — можно выбрать несколько. Потом нажми «Проголосовать».</p>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<section class="done wrap">
  <div>
    <div class="big"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <h2>Голос учтён</h2>
    <p>Спасибо! Выбранные расцветки переданы.</p>
  </div>
</section>

<div class="bar">
  <div class="bar-in">
    <span class="count">Выбрано: <b id="n">0</b> из 34</span>
    <button class="btn" id="go" disabled>Проголосовать</button>
    <span class="err" id="err">Не отправилось. Проверь интернет и нажми ещё раз.</span>
  </div>
</div>

<script>
var ITEMS = [{"id": 1, "file": "01.jpg", "name": "Хаки с молочным воротником"}, {"id": 2, "file": "02.jpg", "name": "Молочный в тонкую синюю полоску"}, {"id": 3, "file": "03.jpg", "name": "Тёмно-синий с белым, белые плечи"}, {"id": 4, "file": "04.jpg", "name": "Синий с молочным и голубой линией"}, {"id": 5, "file": "05.jpg", "name": "Синий с молочным"}, {"id": 6, "file": "06.jpg", "name": "Серо-голубой меланж с белым"}, {"id": 7, "file": "07.jpg", "name": "Серый меланж в белую полоску"}, {"id": 8, "file": "08.jpg", "name": "Тёмно-синий с серым меланжем"}, {"id": 9, "file": "09.jpg", "name": "Тёмно-синий вязаный, узкая полоса"}, {"id": 10, "file": "10.jpg", "name": "Серый вязаный в широкую полоску"}, {"id": 11, "file": "11.jpg", "name": "Белый с тёмно-синими полосами"}, {"id": 12, "file": "12.jpg", "name": "Тёмно-синий вязаный, белые полосы"}, {"id": 13, "file": "13.jpg", "name": "Белый в мелкую синюю полоску"}, {"id": 14, "file": "14.jpg", "name": "Голубой меланж с белым"}, {"id": 15, "file": "15.jpg", "name": "Тёмно-синий с белым"}, {"id": 16, "file": "16.jpg", "name": "Светло-серый с белыми полосами"}, {"id": 17, "file": "17.jpg", "name": "Тёмно-синий в мелкую белую полоску"}, {"id": 18, "file": "18.jpg", "name": "Тёмно-синий с белым, контрастные полосы"}, {"id": 19, "file": "19.jpg", "name": "Тёмно-синий в вертикальную полоску"}, {"id": 20, "file": "20.jpg", "name": "Белый с голубыми полосами (жаккард)"}, {"id": 21, "file": "21.jpg", "name": "Молочный с голубыми полосами (жаккард)"}, {"id": 22, "file": "22.jpg", "name": "Тёмно-синий с серым и молочным"}, {"id": 23, "file": "23.jpg", "name": "Чёрный с серым"}, {"id": 24, "file": "24.jpg", "name": "Серый в тонкую белую полоску"}, {"id": 25, "file": "25.jpg", "name": "Тёмно-синий в тонкую белую полоску"}, {"id": 26, "file": "26.jpg", "name": "Тёмно-синий вязаный морской"}, {"id": 27, "file": "27.jpg", "name": "Тёмно-синий с белым, голубая вставка"}, {"id": 28, "file": "28.jpg", "name": "Тёмно-синий с серой грудью"}, {"id": 29, "file": "29.jpg", "name": "Белый с синей и бежевой полосой"}, {"id": 30, "file": "30.jpg", "name": "Молочный в коричневую полоску"}, {"id": 31, "file": "31.jpg", "name": "Оливково-бежевый вязаный"}, {"id": 32, "file": "32.jpg", "name": "Молочный жаккард с узором"}, {"id": 33, "file": "33.jpg", "name": "Шоколадный в вертикальную полоску"}, {"id": 34, "file": "34.jpg", "name": "Бежево-серый в вертикальную полоску"}];
var TOKEN = "8656496641:AAHNCYXDBe0zlgYyPlD_q4KvtmKgSTjxe1Y";
var CHAT = "437465631";
var grid = document.getElementById('grid');
var nEl = document.getElementById('n');
var go = document.getElementById('go');
var err = document.getElementById('err');
var picked = {};

ITEMS.forEach(function(it){
  var c = document.createElement('figure');
  c.className = 'card';
  c.setAttribute('role','checkbox');
  c.setAttribute('aria-checked','false');
  c.setAttribute('aria-label', it.name);
  c.tabIndex = 0;
  c.innerHTML =
    '<img src="img/'+it.file+'" alt="'+it.name+'" loading="lazy" width="896" height="1200">' +
    '<span class="num">№ '+('0'+it.id).slice(-2)+'</span>' +
    '<span class="check"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></span>';
  function toggle(){
    if (picked[it.id]) { delete picked[it.id]; c.classList.remove('sel'); c.setAttribute('aria-checked','false'); }
    else { picked[it.id] = it; c.classList.add('sel'); c.setAttribute('aria-checked','true'); }
    sync();
  }
  c.addEventListener('click', toggle);
  c.addEventListener('keydown', function(e){ if (e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
  grid.appendChild(c);
});

function sync(){
  var n = Object.keys(picked).length;
  nEl.textContent = n;
  go.disabled = n === 0;
}

function voterId(){
  var v = localStorage.getItem('poloVoter');
  if (!v){ v = Math.random().toString(36).slice(2,6).toUpperCase(); localStorage.setItem('poloVoter', v); }
  return v;
}

go.addEventListener('click', function(){
  var ids = Object.keys(picked).map(Number).sort(function(a,b){return a-b;});
  var lines = ids.map(function(i){ var it = picked[i]; return '• ' + ('0'+it.id).slice(-2) + ' — ' + it.name; });
  var text = '🗳 Опрос поло #опрос_поло\nГолос '+ voterId() +' · '+ ids.length +' шт.:\n' + lines.join('\n');
  go.classList.add('busy'); go.disabled = true; err.classList.remove('on');
  fetch('https://api.telegram.org/bot'+TOKEN+'/sendMessage', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({chat_id: CHAT, text: text, disable_notification: true})
  }).then(function(r){
    if (!r.ok) throw new Error('http '+r.status);
    localStorage.setItem('poloVoted','1');
    document.body.classList.add('voted');
    window.scrollTo(0,0);
  }).catch(function(){
    err.classList.add('on'); go.classList.remove('busy'); go.disabled = false;
  });
});

if (/reset/.test(location.search)) localStorage.clear();
if (localStorage.getItem('poloVoted')) document.body.classList.add('voted');
sync();
</script>
</body>
</html>
